name: kana_path
description: Offline Japanese kana and kanji lessons with keyboard and handwriting practice.
publish_to: none
version: 1.0.2+3
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
  google_mlkit_digital_ink_recognition: 0.16.1
  path: ^1.9.1
  sqflite: ^2.4.2
  unorm_dart: ^0.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/curriculum/
    - assets/strokes/
    - assets/licenses/
